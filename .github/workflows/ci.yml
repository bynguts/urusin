name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, budget, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout (riwayat lengkap untuk audit-history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget (JS awal <= 70 KB gzip)
        run: pnpm budget

      - name: Audit riwayat commit
        run: node scripts/audit-history.mjs

      - name: Pindai PII/secret di semua file terlacak
        run: node scripts/pii-scan.mjs --all
