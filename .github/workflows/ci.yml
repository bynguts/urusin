name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, budget, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout (riwayat lengkap untuk audit-history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --ignore-scripts: tidak ada skrip lifecycle dependensi di CI (prepare milik workspace dijalankan
      # oleh turbo/wxt saat dibutuhkan, setelah paket workspace dibangun).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Semua `uses:` dipin ke commit SHA
        run: node scripts/check-action-pins.mjs

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget (JS awal <= 70 KB gzip)
        run: pnpm budget

      # Pada PR, checkout berada di merge commit buatan GitHub; audit hanya commit milik PR.
      - name: Audit riwayat commit
        env:
          AUDIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
        run: node scripts/audit-history.mjs "$AUDIT_RANGE"

      - name: Pindai PII/secret di semua file terlacak
        run: node scripts/pii-scan.mjs --all

  perf:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # Rute dan batas ada di perf-routes.cjs dan lighthouserc.cjs. Emulasi mobile (Moto G Power, slow 4G),
      # 3 run, median; pelanggaran apa pun menggagalkan job.
      - name: Lighthouse CI
        env:
          PORT: '4173'
          HOST: 127.0.0.1
          ORIGIN: http://127.0.0.1:4173
        run: pnpm exec lhci autorun

      - name: Ringkasan skor
        if: always()
        run: |
          {
            echo "### Lighthouse (mobile, median 3 run)"
            echo
            echo "| URL | Performance | Accessibility | LCP (ms) | TBT (ms) | Script (KB) | Total (KB) |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            const runs = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f)).map((f) => JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"))) : [];
            const med = (a) => a.sort((x, y) => x - y)[Math.floor(a.length / 2)];
            const by = new Map();
            for (const r of runs) (by.get(r.finalUrl) ?? by.set(r.finalUrl, []).get(r.finalUrl)).push(r);
            for (const [url, rs] of by) {
              const p = med(rs.map((r) => r.categories.performance.score * 100));
              const a = med(rs.map((r) => r.categories.accessibility.score * 100));
              const l = med(rs.map((r) => r.audits["largest-contentful-paint"].numericValue));
              const t = med(rs.map((r) => r.audits["total-blocking-time"].numericValue));
              const sc = med(rs.map((r) => r.audits["resource-summary"].details.items.find((i) => i.resourceType === "script").transferSize));
              const tw = med(rs.map((r) => r.audits["total-byte-weight"].numericValue));
              console.log(`| ${url} | ${p} | ${a} | ${Math.round(l)} | ${Math.round(t)} | ${(sc / 1024).toFixed(1)} | ${(tw / 1024).toFixed(1)} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/*.html
          if-no-files-found: ignore

  e2e:
    name: E2E ekstensi (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Chromium bawaan Playwright, bukan Chrome bermerek: Chrome >= 137 mengabaikan --load-extension.
      # Tes memakai channel 'chromium' (headless baru, mendukung ekstensi), jadi xvfb tidak diperlukan.
      - name: Pasang Chromium Playwright
        run: pnpm --filter @urusin/extension exec playwright install --with-deps chromium

      # turbo membangun web, fixtures, dan ekstensi lebih dulu. Tes memuat ekstensi lewat
      # launchPersistentContext, menegaskan ID ekstensi == PUBLIC_EXTENSION_ID, dan menyalakan fixtures + web.
      - name: E2E
        run: pnpm e2e

      - name: Unggah trace bila gagal
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: apps/extension/test-results/
          if-no-files-found: ignore

  coverage:
    name: Coverage (ambang per paket)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Gagal bila coverage di bawah ambang pada vitest.config.ts tiap paket.
      - name: Coverage
        run: pnpm coverage

      - name: Ringkasan coverage
        if: always()
        run: |
          {
            echo "### Coverage per paket"
            echo
            echo '```'
            node scripts/coverage-summary.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah laporan lcov dan html
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (riwayat lengkap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pasang gitleaks (checksum diverifikasi)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" "$base/$tarball"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Pindai riwayat
        run: gitleaks git --redact --no-banner --verbose .
