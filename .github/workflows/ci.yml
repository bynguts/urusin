name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, budget, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout (riwayat lengkap untuk audit-history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --ignore-scripts: tidak ada skrip lifecycle dependensi di CI (prepare milik workspace dijalankan
      # oleh turbo/wxt saat dibutuhkan, setelah paket workspace dibangun).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Semua `uses:` dipin ke commit SHA
        run: node scripts/check-action-pins.mjs

      - name: Job tag tidak membangun image (hanya alias digest)
        run: node scripts/check-tag-no-build.mjs

      - name: Snippet Caddy cocok dengan deploy/hosts.json (hostname literal)
        run: node scripts/gen-caddyfile.mjs --check

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget (JS awal <= 70 KB gzip)
        run: pnpm budget

      # Pada PR, checkout berada di merge commit buatan GitHub; audit hanya commit milik PR.
      - name: Audit riwayat commit
        env:
          AUDIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
        run: node scripts/audit-history.mjs "$AUDIT_RANGE"

      - name: Pindai PII/secret di semua file terlacak
        run: node scripts/pii-scan.mjs --all

  perf:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # Rute dan batas ada di perf-routes.cjs dan lighthouserc.cjs. Emulasi mobile (Moto G Power, slow 4G),
      # 3 run, median; pelanggaran apa pun menggagalkan job.
      - name: Lighthouse CI
        env:
          PORT: '4173'
          HOST: 127.0.0.1
          ORIGIN: http://127.0.0.1:4173
        run: pnpm exec lhci autorun

      - name: Ringkasan skor
        if: always()
        run: |
          {
            echo "### Lighthouse (mobile, median 3 run)"
            echo
            echo "| URL | Performance | Accessibility | LCP (ms) | TBT (ms) | Script (KB) | Total (KB) |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            const runs = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f)).map((f) => JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"))) : [];
            const med = (a) => a.sort((x, y) => x - y)[Math.floor(a.length / 2)];
            const by = new Map();
            for (const r of runs) (by.get(r.finalUrl) ?? by.set(r.finalUrl, []).get(r.finalUrl)).push(r);
            for (const [url, rs] of by) {
              const p = med(rs.map((r) => r.categories.performance.score * 100));
              const a = med(rs.map((r) => r.categories.accessibility.score * 100));
              const l = med(rs.map((r) => r.audits["largest-contentful-paint"].numericValue));
              const t = med(rs.map((r) => r.audits["total-blocking-time"].numericValue));
              const sc = med(rs.map((r) => r.audits["resource-summary"].details.items.find((i) => i.resourceType === "script").transferSize));
              const tw = med(rs.map((r) => r.audits["total-byte-weight"].numericValue));
              console.log(`| ${url} | ${p} | ${a} | ${Math.round(l)} | ${Math.round(t)} | ${(sc / 1024).toFixed(1)} | ${(tw / 1024).toFixed(1)} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/*.html
          if-no-files-found: ignore

  e2e:
    name: E2E ekstensi (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Chromium bawaan Playwright, bukan Chrome bermerek: Chrome >= 137 mengabaikan --load-extension.
      # Tes memakai channel 'chromium' (headless baru, mendukung ekstensi), jadi xvfb tidak diperlukan.
      - name: Pasang Chromium Playwright
        run: pnpm --filter @urusin/extension exec playwright install --with-deps chromium

      # turbo membangun web, fixtures, dan ekstensi lebih dulu. Tes memuat ekstensi lewat
      # launchPersistentContext, menegaskan ID ekstensi == PUBLIC_EXTENSION_ID, dan menyalakan fixtures + web.
      - name: E2E
        run: pnpm e2e

      - name: Unggah trace bila gagal
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: apps/extension/test-results/
          if-no-files-found: ignore

  coverage:
    name: Coverage (ambang per paket)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Gagal bila coverage di bawah ambang pada vitest.config.ts tiap paket.
      - name: Coverage
        run: pnpm coverage

      - name: Ringkasan coverage
        if: always()
        run: |
          {
            echo "### Coverage per paket"
            echo
            echo '```'
            node scripts/coverage-summary.mjs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah laporan lcov dan html
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: ignore

  rc-compat:
    name: Kompatibilitas rilis kandidat (image rc* terakhir di atas DB HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      HUSKY: '0'
      RC_REPO: ghcr.io/bynguts/urusin-web
      RC_READ_PATH: /api/transparansi
    steps:
      - name: Checkout (riwayat dan tag lengkap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tidak berbuat apa pun selama belum ada tag rc*; setelah ada, langkah di bawah aktif otomatis.
      - name: Cari tag rc* terakhir
        id: rc
        run: |
          tag="$(git tag -l 'rc*' --sort=-version:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::belum ada tag rc*: rc-compat dilewati (tidak ada yang diperiksa)"
            echo "rc-compat: belum ada tag rc*, dilewati." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "rc-compat: memakai tag ${tag}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Migrasi sejak tag rc harus aditif (tanpa DROP/RENAME)
        if: steps.rc.outputs.present == 'true'
        run: node scripts/check-additive-migrations.mjs "${{ steps.rc.outputs.tag }}"

      - name: Setup pnpm
        if: steps.rc.outputs.present == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        if: steps.rc.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.rc.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Login GHCR
        if: steps.rc.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolusi digest image tag rc
        if: steps.rc.outputs.present == 'true'
        id: img
        run: |
          digest="$(docker buildx imagetools inspect "${RC_REPO}:${{ steps.rc.outputs.tag }}" --format '{{.Manifest.Digest}}')"
          echo "ref=${RC_REPO}@${digest}" >> "$GITHUB_OUTPUT"
          echo "- image: \`${RC_REPO}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          docker pull "${RC_REPO}@${digest}"

      # DB dibuat, dimigrasi, dan diisi oleh kode HEAD: satu urusan normal (3 event berantai hash) dan satu
      # urusan ber-state dari masa depan (harus terdegradasi, bukan 5xx, di image rc).
      - name: Migrasi dan seed DB dengan kode HEAD
        if: steps.rc.outputs.present == 'true'
        id: seed
        run: |
          pnpm turbo run build --filter=@urusin/harness
          mkdir -p rc-compat-data && chmod 777 rc-compat-data
          ids="$(DB_PATH="${PWD}/rc-compat-data/urusin.db" node apps/web/scripts/db-seed.mjs | tail -n1)"
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"
          echo "- DB uji: ${ids}" >> "$GITHUB_STEP_SUMMARY"
          chmod 666 rc-compat-data/urusin.db* 2>/dev/null || true

      - name: Boot image rc di atas DB HEAD dan smoke test
        if: steps.rc.outputs.present == 'true'
        run: |
          docker run -d --name rc -p 127.0.0.1:3000:3000 -e ORIGIN=http://localhost:3000 \
            -v "${PWD}/rc-compat-data:/data" "${{ steps.img.outputs.ref }}"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs rc; exit 1; }
          node scripts/rc-compat-smoke.mjs http://127.0.0.1:3000 '${{ steps.seed.outputs.ids }}' | tee -a rc-smoke.log || { docker logs rc; exit 1; }
          { echo '```'; cat rc-smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Log kontainer bila gagal
        if: failure() && steps.rc.outputs.present == 'true'
        run: docker logs rc || true

  contract-freeze:
    name: Pembekuan kontrak (vs contracts-take1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - name: Checkout (riwayat dan tag lengkap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bangun kontrak
        run: pnpm --filter @urusin/contracts build

      # Dilewati dengan log jelas selama tag contracts-take1 belum ada. Sesudahnya: hanya perubahan aditif yang lolos.
      - name: Bandingkan skema dengan tag contracts-take1
        run: node scripts/check-contract-freeze.mjs contracts-take1

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (riwayat lengkap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pasang gitleaks (checksum diverifikasi)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" "$base/$tarball"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Pindai riwayat
        run: gitleaks git --redact --no-banner --verbose .
