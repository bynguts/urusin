name: Release

# Membangun image web + fixtures + pendamping + embedding multi-arch (amd64 + arm64).
#   - push ke main : image bertag <sha> (VPS menarik berdasarkan digest, lihat deploy/deploy.sh).
#   - tag rc* / v* : TIDAK membangun ulang. Image <sha> milik commit bertag di-alias (digest sama) menjadi <tag>,
#     lalu GitHub Release dibuat dari SBOM hasil run main untuk SHA yang sama. Jadi yang diuji
#     di main, yang dirilis. Gagal bila image <sha> atau run main untuk commit itu tidak ada.
# Tidak ada QEMU: Dockerfile membangun JS di platform runner dan hanya menyalin dependensi produksi per arsitektur
# (lihat apps/web/Dockerfile). Rilis bukan commit, jadi aman untuk scripts/audit-history.mjs.

on:
  push:
    branches: [main]
    tags: ['rc*', 'v*']
  workflow_dispatch:
    inputs:
      simpan_vps:
        description: 'Runner self-hosted: simpan image native di docker host agent-vm (deploy tanpa login GHCR)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.name }}
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.URUSIN_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.URUSIN_RUNNER && 90 || 30 }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/bynguts/urusin-web
          - name: fixtures
            dockerfile: apps/fixtures/Dockerfile
            image: ghcr.io/bynguts/urusin-fixtures
          - name: pendamping
            dockerfile: apps/pendamping/Dockerfile
            image: ghcr.io/bynguts/urusin-pendamping
          # Sidecar embedding (llama.cpp + model dipin sha256, dikonversi di platform builder; tanpa QEMU).
          - name: embedding
            dockerfile: apps/embedding/Dockerfile
            image: ghcr.io/bynguts/urusin-embedding
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU hanya dipakai untuk smoke test image arm64 di bawah; build image tidak membutuhkannya.
      - name: Setup QEMU (smoke arm64)
        if: runner.environment == 'github-hosted'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        if: runner.environment == 'github-hosted'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push
        id: build
        if: runner.environment == 'github-hosted'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max

      # Self-hosted (agent-vm, arm64): build lewat ci-docker dengan builder buildx `urusin-ci` (docker-container,
      # cache <= 1,5 GB, gc setelah tiap build, hanya builder itu). amd64 memakai binfmt qemu-x86_64 yang SUDAH ada di host
      # (tidak pernah dipasang oleh CI). Token GHCR lewat stdin. Mencetak "DIGEST: sha256:..." seperti di atas.
      - name: Build dan push (self-hosted, builder urusin-ci)
        id: build_self
        if: runner.environment == 'self-hosted'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /opt/urusin-ci/bin/ci-docker build "$NAME" "$GITHUB_SHA" "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/build.log"
          digest="$(sed -nE 's/^DIGEST: (sha256:[0-9a-f]{64})$/\1/p' "$RUNNER_TEMP/build.log" | tail -n1)"
          [ -n "$digest" ] || { echo "::error::digest tidak ditemukan"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Smoke test image yang baru di-push, per arsitektur: modul native harus termuat dan server harus hidup.
      - name: Smoke test image (amd64 dan arm64)
        if: runner.environment == 'github-hosted'
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          for arch in amd64 arm64; do
            echo "::group::${NAME} linux/${arch}"
            if [ "$NAME" = "web" ]; then
              timeout 600 docker run --rm --platform "linux/${arch}" --entrypoint node "$REF"                 -e "const a=process.arch;const r=require('better-sqlite3')(':memory:').prepare('select 1 as x').get();if(r.x!==1)process.exit(1);console.log(a,'better-sqlite3 ok')"
            elif [ "$NAME" = "pendamping" ]; then
              # Kontainer pendamping tanpa no-new-privileges: chrome-sandbox HARUS satu-satunya biner SUID/SGID,
              # dan tidak ada berkas ber-capability (getcap ada di image dan keluarannya kosong).
              timeout 600 docker run --rm --platform "linux/${arch}" --network none --entrypoint sh "$REF" -c                 'f=$(find / -xdev -type f -perm /6000 2>/dev/null); echo "$f"; case "$f" in /ms-playwright/chromium-1254/chrome-linux64/chrome-sandbox|/ms-playwright/chromium-1254/chrome-linux-arm64/chrome-sandbox) ;; *) exit 1 ;; esac; [ "$(stat -c %u:%a "$f")" = 0:4755 ] && [ "$CHROME_DEVEL_SANDBOX" = "$f" ] && command -v getcap >/dev/null && c=$(getcap -r / 2>/dev/null) && echo "getcap: [$c]" && [ -z "$c" ]'
              if [ "$arch" = "amd64" ]; then
                # Boot produksi dengan pengerasan yang sama seperti compose (seccomp Playwright, SYS_ADMIN +
                # SYS_CHROOT untuk sandbox setuid tanpa no-new-privileges, read-only, tanpa jaringan; ADR 0029):
                # main.js menolak start bila ada rute keluar atau sandbox Chromium
                # headed tidak aktif, jadi /health 200 = kedua pemeriksaan boot lulus. --init: tanpa init,
                # xvfb-run/Xvfb sebagai PID 1 bisa menggantung. Edge sendiri: modulnya harus termuat. Token dibuat
                # acak di langkah ini (literal berentropi tinggi di repo memicu Gitleaks).
                timeout 300 docker run --rm --init --platform "linux/${arch}" --network none --read-only                   --tmpfs /tmp:size=768m --cap-drop ALL --cap-add SYS_ADMIN --cap-add SYS_CHROOT                   --security-opt seccomp=deploy/pendamping-seccomp.json                   -e PENDAMPING_INTERNAL_TOKEN="$(openssl rand -hex 32)"                   -e PENDAMPING_EDGE_URL=http://pendamping-edge:3129                   -e PENDAMPING_EDGE_TOKEN="$(openssl rand -hex 32)"                   -e URUSIN_PUBLIC_ORIGIN=https://smoke.test --entrypoint sh "$REF" -c                   'node dist/main.js & for i in $(seq 1 60); do node dist/sehat.js 4330 && echo "pendamping ok (sandbox + tanpa rute)" && exit 0; kill -0 $! 2>/dev/null || exit 1; sleep 2; done; exit 1'
                timeout 120 docker run --rm --platform "linux/${arch}" --network none --entrypoint node "$REF"                   -e "import('./dist/edge.js').then((m)=>{m.loadEdgeConfig({PENDAMPING_EDGE_TOKEN:'x'.repeat(40)});console.log('edge ok')})"
              else
                # arm64 di QEMU: Chromium/userns tidak diemulasikan dengan andal; cukup modul termuat.
                timeout 600 docker run --rm --platform "linux/${arch}" --network none --entrypoint node "$REF"                   -e "Promise.all([import('./dist/config.js'),import('./dist/edge.js'),import('playwright-core')]).then(()=>console.log(process.arch,'modul ok'))"
              fi
            elif [ "$NAME" = "embedding" ]; then
              # Boot dengan pengerasan compose (nobody, read-only, tanpa kapabilitas, tanpa jaringan), lalu uji
              # semantik: kueri "akta kelahiran" harus lebih dekat ke label "Pencatatan Kelahiran" daripada
              # "Pajak Kendaraan" (model terbakar, pooling dan tokenizer benar). arm64 di QEMU lambat: timeout longgar.
              timeout 900 docker run --rm --platform "linux/${arch}" --network none --read-only --tmpfs /tmp:size=16m \
                --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh "$REF" -c \
                '/app/llama-server & for i in $(seq 1 240); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; kill -0 $! || exit 1; sleep 2; done; /usr/local/bin/embed-smoke'
            else
              timeout 600 docker run --rm --platform "linux/${arch}" --entrypoint sh "$REF" -c                 'node dist/server.js & sleep 5; node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && echo "fixtures ok"'
            fi
            echo "::endgroup::"
          done

      # Self-hosted: smoke HANYA arsitektur native host (arm64; boot pendamping penuh dengan pengerasan compose).
      # amd64 tetap dibangun + di-push dan divalidasi lewat manifest index; node amd64 di bawah qemu-x86_64 bisa
      # menggantung tanpa CPU. Setiap docker run smoke dibatasi timeout; image smoke dibuang setelahnya.
      - name: Smoke test image (self-hosted, arm64 native)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 30
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build_self.outputs.digest }}
        run: printf '%s\n' "$GHCR_TOKEN" | sudo -n /opt/urusin-ci/bin/ci-docker smoke "$NAME" "$DIGEST" "$GITHUB_WORKSPACE"

      # Opsional (workflow_dispatch simpan_vps=true): setelah smoke lulus, image native DISIMPAN di docker host
      # agent-vm beserta salinan provenance (/opt/urusin-ci/provenance), memakai GITHUB_TOKEN job ini. deploy.sh
      # lalu memakai image lokal tanpa kredensial GHCR di VPS (label revision + provenance tetap diperiksa).
      - name: Simpan image di VPS (self-hosted, simpan_vps)
        if: runner.environment == 'self-hosted' && inputs.simpan_vps
        timeout-minutes: 20
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build_self.outputs.digest }}
        run: printf '%s\n' "$GHCR_TOKEN" | sudo -n /opt/urusin-ci/bin/ci-docker simpan "$NAME" "$DIGEST" "$GITHUB_WORKSPACE"

      # SBOM disimpan sebagai attestation di registry; ekstrak untuk dilampirkan ke GitHub Release.
      - name: Ekstrak SBOM
        if: runner.environment == 'github-hosted'
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$REF" --format '{{ json .SBOM }}' > "sbom-${{ matrix.name }}.json"

      - name: Ekstrak SBOM (self-hosted)
        if: runner.environment == 'self-hosted'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build_self.outputs.digest }}
        run: |
          # shellcheck disable=SC2024 # berkas SBOM sengaja ditulis sebagai user runner, bukan root
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /opt/urusin-ci/bin/ci-docker sbom "$NAME" "$DIGEST" > "sbom-${NAME}.json"

      - name: Unggah SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json

      - name: Ringkasan digest
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DIGEST: ${{ steps.build.outputs.digest || steps.build_self.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### Image ${NAME}"
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: linux/amd64, linux/arm64 (runner: ${RUNNER_ENVIRONMENT})"
            echo
            echo '```sh'
            if [ "$NAME" = "web" ]; then
              echo "deploy/deploy.sh ${GITHUB_SHA} ${IMAGE}@${DIGEST}"
            elif [ "$NAME" = "pendamping" ]; then
              echo "PENDAMPING_IMAGE=${IMAGE}@${DIGEST}"
            elif [ "$NAME" = "embedding" ]; then
              echo "EMBEDDING_IMAGE=${IMAGE}@${DIGEST}"
            else
              echo "FIXTURES_IMAGE=${IMAGE}@${DIGEST}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Alias image <sha> menjadi tag rilis (tanpa build ulang)
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.URUSIN_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.URUSIN_RUNNER && 30 || 10 }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Setup Buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        if: runner.environment == 'github-hosted'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias image web, fixtures, pendamping, dan embedding ke tag rilis (self-hosted)
        if: runner.environment == 'self-hosted'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Image rilis ${TAG}"
            echo
            echo "Commit bertag: \`${GITHUB_SHA}\` (tidak ada build ulang; digest sama dengan yang diuji di main)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2024 # ringkasan sengaja ditulis sebagai user runner, bukan root
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /opt/urusin-ci/bin/ci-docker alias "$GITHUB_SHA" "$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Alias image web, fixtures, pendamping, dan embedding ke tag rilis
        if: runner.environment == 'github-hosted'
        run: |
          {
            echo "### Image rilis ${TAG}"
            echo
            echo "Commit bertag: \`${GITHUB_SHA}\` (tidak ada build ulang; digest sama dengan yang diuji di main)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for image in ghcr.io/bynguts/urusin-web ghcr.io/bynguts/urusin-fixtures ghcr.io/bynguts/urusin-pendamping ghcr.io/bynguts/urusin-embedding; do
            if ! digest="$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}' 2>/dev/null)" || [ -z "$digest" ]; then
              echo "::error::tidak ada image ${image}:${GITHUB_SHA}. Tag harus menunjuk commit main yang sudah dibangun oleh workflow Release."
              exit 1
            fi
            docker buildx imagetools create -t "${image}:${TAG}" "${image}@${digest}"
            # Tag harus persis image yang diuji: digest :<tag> wajib sama dengan digest :<sha> setelah alias.
            tag_digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            sha_digest="$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
            if [ -z "$tag_digest" ] || [ "$tag_digest" != "$sha_digest" ]; then
              echo "::error::digest ${image}:${TAG} (${tag_digest}) tidak sama dengan ${image}:${GITHUB_SHA} (${sha_digest})."
              exit 1
            fi
            echo "- \`${image}:${TAG}\` = \`${image}@${tag_digest}\` (sama dengan \`:${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          done

  github-release:
    name: GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: [promote]
    runs-on: ${{ (github.event_name != 'pull_request' && vars.URUSIN_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.URUSIN_RUNNER && 30 || 10 }}
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # SBOM dibuat oleh run main untuk SHA yang sama; disalin, bukan dibangun ulang.
      - name: Cari run Release yang sukses untuk SHA ini
        id: run
        run: |
          id="$(gh run list --workflow release.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId,headBranch --jq '[.[] | select(.headBranch=="main")][0].databaseId')"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::tidak ada run Release sukses di main untuk ${GITHUB_SHA}; tidak ada SBOM untuk dilampirkan."
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Unduh SBOM dari run tersebut
        run: |
          mkdir -p assets
          for name in sbom-web sbom-fixtures sbom-pendamping sbom-embedding; do
            gh run download "${{ steps.run.outputs.id }}" --dir assets --name "$name"
          done
          ls -l assets

      - name: Buat GitHub Release
        run: |
          flags=""
          case "$TAG" in rc*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $flags assets/*
