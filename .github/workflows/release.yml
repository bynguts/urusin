name: Release image

# Membangun image web multi-arch (amd64 + arm64) per commit di main dan push ke GHCR.
# VPS menarik image berdasarkan digest (lihat deploy/deploy.sh); tidak pernah build di VPS.
# Repo privat: arm64 dibangun lewat QEMU, bukan runner arm.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bynguts/urusin-web

jobs:
  web-image:
    name: Build dan push image web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Ringkasan digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image web"
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: linux/amd64, linux/arm64"
            echo
            echo "Deploy di VPS:"
            echo
            echo '```sh'
            echo "deploy/deploy.sh ${GITHUB_SHA} ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
