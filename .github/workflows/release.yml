name: Release

# Membangun image web + fixtures multi-arch (amd64 + arm64) dan zip ekstensi.
#   - push ke main : image bertag <sha> (VPS menarik berdasarkan digest, lihat deploy/deploy.sh).
#   - tag rc* / v* : sama, ditambah tag image <tag> dan GitHub Release (catatan otomatis, zip ekstensi, SBOM).
# Tidak ada QEMU: Dockerfile membangun JS di platform runner dan hanya menyalin dependensi produksi per arsitektur
# (lihat apps/web/Dockerfile). Rilis bukan commit, jadi aman untuk scripts/audit-history.mjs.

on:
  push:
    branches: [main]
    tags: ['rc*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/bynguts/urusin-web
          - name: fixtures
            dockerfile: apps/fixtures/Dockerfile
            image: ghcr.io/bynguts/urusin-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU hanya dipakai untuk smoke test image arm64 di bawah; build image tidak membutuhkannya.
      - name: Setup QEMU (smoke arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', matrix.image, github.ref_name) || '' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max

      # Smoke test image yang baru di-push, per arsitektur: modul native harus termuat dan server harus hidup.
      - name: Smoke test image (amd64 dan arm64)
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          for arch in amd64 arm64; do
            echo "::group::${NAME} linux/${arch}"
            if [ "$NAME" = "web" ]; then
              docker run --rm --platform "linux/${arch}" --entrypoint node "$REF"                 -e "const a=process.arch;const r=require('better-sqlite3')(':memory:').prepare('select 1 as x').get();if(r.x!==1)process.exit(1);console.log(a,'better-sqlite3 ok')"
            else
              docker run --rm --platform "linux/${arch}" --entrypoint sh "$REF" -c                 'node dist/server.js & sleep 5; node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && echo "fixtures ok"'
            fi
            echo "::endgroup::"
          done

      # SBOM disimpan sebagai attestation di registry; ekstrak untuk dilampirkan ke GitHub Release.
      - name: Ekstrak SBOM
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$REF" --format '{{ json .SBOM }}' > "sbom-${{ matrix.name }}.json"

      - name: Unggah SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json

      - name: Ringkasan digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### Image ${NAME}"
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: linux/amd64, linux/arm64"
            echo
            echo '```sh'
            if [ "$NAME" = "web" ]; then
              echo "deploy/deploy.sh ${GITHUB_SHA} ${IMAGE}@${DIGEST}"
            else
              echo "FIXTURES_IMAGE=${IMAGE}@${DIGEST}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  extension:
    name: Zip ekstensi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bangun dependensi workspace
        run: pnpm turbo run build --filter=@urusin/core

      - name: Zip ekstensi
        run: pnpm --filter @urusin/extension zip

      # Zip untuk SETIAP SHA main (bukan hanya tag): penguji memakai zip SHA kandidat; tag rc1 nanti menunjuk SHA yang sama.
      - name: Beri nama zip dengan SHA dan catat sha256
        run: |
          sha7="${GITHUB_SHA:0:7}"
          zip="urusin-ext-${sha7}.zip"
          mkdir -p dist-ext
          cp apps/extension/.output/*-chrome.zip "dist-ext/${zip}"
          (cd dist-ext && sha256sum "${zip}" > "${zip}.sha256")
          {
            echo "### Zip ekstensi"
            echo
            echo "- Berkas: \`${zip}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- sha256: \`$(cut -d' ' -f1 "dist-ext/${zip}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            dist-ext/urusin-ext-*.zip
            dist-ext/urusin-ext-*.zip.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: [images, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Unduh zip ekstensi dan SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$TAG" in rc*) flags="--prerelease" ;; esac
          ls -l assets
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $flags assets/*
