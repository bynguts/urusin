name: Release

# Membangun image web + fixtures multi-arch (amd64 + arm64).
#   - push ke main : image bertag <sha> (VPS menarik berdasarkan digest, lihat deploy/deploy.sh).
#   - tag rc* / v* : TIDAK membangun ulang. Image <sha> milik commit bertag di-alias (digest sama) menjadi <tag>,
#     lalu GitHub Release dibuat dari SBOM hasil run main untuk SHA yang sama. Jadi yang diuji
#     di main, yang dirilis. Gagal bila image <sha> atau run main untuk commit itu tidak ada.
# Tidak ada QEMU: Dockerfile membangun JS di platform runner dan hanya menyalin dependensi produksi per arsitektur
# (lihat apps/web/Dockerfile). Rilis bukan commit, jadi aman untuk scripts/audit-history.mjs.

on:
  push:
    branches: [main]
    tags: ['rc*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.name }}
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/bynguts/urusin-web
          - name: fixtures
            dockerfile: apps/fixtures/Dockerfile
            image: ghcr.io/bynguts/urusin-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU hanya dipakai untuk smoke test image arm64 di bawah; build image tidak membutuhkannya.
      - name: Setup QEMU (smoke arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max

      # Smoke test image yang baru di-push, per arsitektur: modul native harus termuat dan server harus hidup.
      - name: Smoke test image (amd64 dan arm64)
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          for arch in amd64 arm64; do
            echo "::group::${NAME} linux/${arch}"
            if [ "$NAME" = "web" ]; then
              docker run --rm --platform "linux/${arch}" --entrypoint node "$REF"                 -e "const a=process.arch;const r=require('better-sqlite3')(':memory:').prepare('select 1 as x').get();if(r.x!==1)process.exit(1);console.log(a,'better-sqlite3 ok')"
            else
              docker run --rm --platform "linux/${arch}" --entrypoint sh "$REF" -c                 'node dist/server.js & sleep 5; node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && echo "fixtures ok"'
            fi
            echo "::endgroup::"
          done

      # SBOM disimpan sebagai attestation di registry; ekstrak untuk dilampirkan ke GitHub Release.
      - name: Ekstrak SBOM
        env:
          REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$REF" --format '{{ json .SBOM }}' > "sbom-${{ matrix.name }}.json"

      - name: Unggah SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json

      - name: Ringkasan digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### Image ${NAME}"
            echo
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platform: linux/amd64, linux/arm64"
            echo
            echo '```sh'
            if [ "$NAME" = "web" ]; then
              echo "deploy/deploy.sh ${GITHUB_SHA} ${IMAGE}@${DIGEST}"
            else
              echo "FIXTURES_IMAGE=${IMAGE}@${DIGEST}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Alias image <sha> menjadi tag rilis (tanpa build ulang)
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias image web dan fixtures ke tag rilis
        run: |
          {
            echo "### Image rilis ${TAG}"
            echo
            echo "Commit bertag: \`${GITHUB_SHA}\` (tidak ada build ulang; digest sama dengan yang diuji di main)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for image in ghcr.io/bynguts/urusin-web ghcr.io/bynguts/urusin-fixtures; do
            if ! digest="$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}' 2>/dev/null)" || [ -z "$digest" ]; then
              echo "::error::tidak ada image ${image}:${GITHUB_SHA}. Tag harus menunjuk commit main yang sudah dibangun oleh workflow Release."
              exit 1
            fi
            docker buildx imagetools create -t "${image}:${TAG}" "${image}@${digest}"
            # Tag harus persis image yang diuji: digest :<tag> wajib sama dengan digest :<sha> setelah alias.
            tag_digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            sha_digest="$(docker buildx imagetools inspect "${image}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
            if [ -z "$tag_digest" ] || [ "$tag_digest" != "$sha_digest" ]; then
              echo "::error::digest ${image}:${TAG} (${tag_digest}) tidak sama dengan ${image}:${GITHUB_SHA} (${sha_digest})."
              exit 1
            fi
            echo "- \`${image}:${TAG}\` = \`${image}@${tag_digest}\` (sama dengan \`:${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          done

  github-release:
    name: GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: [promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # SBOM dibuat oleh run main untuk SHA yang sama; disalin, bukan dibangun ulang.
      - name: Cari run Release yang sukses untuk SHA ini
        id: run
        run: |
          id="$(gh run list --workflow release.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId,headBranch --jq '[.[] | select(.headBranch=="main")][0].databaseId')"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::tidak ada run Release sukses di main untuk ${GITHUB_SHA}; tidak ada SBOM untuk dilampirkan."
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Unduh SBOM dari run tersebut
        run: |
          mkdir -p assets
          for name in sbom-web sbom-fixtures; do
            gh run download "${{ steps.run.outputs.id }}" --dir assets --name "$name"
          done
          ls -l assets

      - name: Buat GitHub Release
        run: |
          flags=""
          case "$TAG" in rc*) flags="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $flags assets/*
