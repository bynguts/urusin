# Uji compose di laptop: build image dari checkout lokal.
#   cp ../.env.example .env   (isi minimal SESSION_SECRET dan kunci test Turnstile)
#   docker compose -f compose.local.yml --env-file .env up --build
# Web di http://localhost:3000
name: urusin-local

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: urusin-web:local
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      ORIGIN: http://localhost:3000
      BODY_SIZE_LIMIT: 6M
      DATABASE_URL: file:/data/urusin.db
      # Kunci test Turnstile Cloudflare (selalu lolos); aman untuk lokal.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m

volumes:
  data:
