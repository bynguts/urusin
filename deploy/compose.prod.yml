# Produksi (VPS arm64/amd64). Jalankan lewat deploy/deploy.sh; jangan `up` manual tanpa .env.images.
# Port hanya di loopback; Caddy sistem (host) meneruskan {$DOMAIN} dan verify.{$DOMAIN} ke
# 4310 (web-blue) dan 4311 (web-green) dengan `lb_policy first` (lihat Caddyfile.urusin).
#
# Blue/green: deploy.sh memperbarui warna yang menganggur, menunggu sehat, lalu menghentikan warna
# lama. Keduanya memakai volume `data` yang sama (SQLite WAL, satu host): lihat bagian "Migrasi"
# di deploy/README.md; hanya warna baru yang boleh menjalankan migrasi (RUN_MIGRATIONS=1).
name: urusin

x-web: &web
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp:size=64m
  # Batas per kontainer. Saat deploy dua warna hidup bersamaan: total <= 1 GiB dari ~7,6 GiB bebas.
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-web-env: &web-env
  NODE_ENV: production
  PORT: '3000'
  HOST: 0.0.0.0
  ORIGIN: https://${DOMAIN:?DOMAIN wajib diisi}
  PROTOCOL_HEADER: x-forwarded-proto
  ADDRESS_HEADER: x-forwarded-for
  XFF_DEPTH: '1'
  BODY_SIZE_LIMIT: 6M
  DATABASE_URL: file:/data/urusin.db

services:
  # Selalu berdasarkan digest, mis. ghcr.io/bynguts/urusin-web@sha256:... (ditulis deploy.sh ke
  # .env.images). Warna yang belum pernah dideploy memakai placeholder dan tidak dijalankan.
  web-blue:
    <<: *web
    image: ${WEB_IMAGE_BLUE:-ghcr.io/bynguts/urusin-web:unset}
    environment:
      <<: *web-env
      GIT_SHA: ${GIT_SHA_BLUE:-}
      URUSIN_COLOR: blue
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_BLUE:-0}
    ports:
      - '127.0.0.1:4310:3000'
    volumes:
      # SQLite (mode WAL: berkas -wal/-shm ikut di volume ini).
      - data:/data

  web-green:
    <<: *web
    image: ${WEB_IMAGE_GREEN:-ghcr.io/bynguts/urusin-web:unset}
    environment:
      <<: *web-env
      GIT_SHA: ${GIT_SHA_GREEN:-}
      URUSIN_COLOR: green
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_GREEN:-0}
    ports:
      - '127.0.0.1:4311:3000'
    volumes:
      - data:/data

  # Opsional: profil fixture publik (portal palsu untuk demo). Belum tentu ada imagenya.
  # Aktifkan dengan `COMPOSE_PROFILES=fixtures` dan FIXTURES_IMAGE@digest.
  fixtures:
    profiles: [fixtures]
    image: ${FIXTURES_IMAGE:-ghcr.io/bynguts/urusin-fixtures:unset}
    restart: unless-stopped
    environment:
      FIXTURES_PROFILE: public
      FIXTURES_PUBLIC_ORIGIN: https://fixtures.${DOMAIN:?DOMAIN wajib diisi}
    ports:
      - '127.0.0.1:4320:4000'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Opsional: Browser Pendamping (Chromium di server per sesi warga; docs/adr/0028-browser-pendamping.md).
  # Aktifkan dengan `COMPOSE_PROFILES=pendamping`, PENDAMPING_IMAGE@digest, dan di .env:
  #   PENDAMPING_INTERNAL_TOKEN=<acak >= 32 karakter>   (dipakai web DAN pendamping)
  #   PENDAMPING_INTERNAL_URL=http://pendamping:4000    (dibaca web lewat env_file)
  # Web memanggil API internal lewat jaringan compose; port host hanya untuk WebSocket layar yang
  # diteruskan Caddy (/pendamping/ws/*). Chromium tidak bisa menjangkau web/jaringan privat: proxy egress
  # menolak IP privat/loopback/link-local setelah resolusi DNS.
  pendamping:
    profiles: [pendamping]
    image: ${PENDAMPING_IMAGE:-ghcr.io/bynguts/urusin-pendamping:unset}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      HOST: 0.0.0.0
      GIT_SHA: ${GIT_SHA_PENDAMPING:-}
      PENDAMPING_INTERNAL_TOKEN: ${PENDAMPING_INTERNAL_TOKEN:-} # wajib >= 32 karakter; pendamping menolak start tanpanya
      URUSIN_PUBLIC_ORIGIN: https://${DOMAIN:?DOMAIN wajib diisi}
      PENDAMPING_PUBLIC_WS_URL: wss://${DOMAIN:?DOMAIN wajib diisi}/pendamping/ws
      PENDAMPING_MAX_SESSIONS: ${PENDAMPING_MAX_SESSIONS:-2}
      PENDAMPING_MAX_QUEUE: ${PENDAMPING_MAX_QUEUE:-20}
      PENDAMPING_SESSION_MEM_MB: ${PENDAMPING_SESSION_MEM_MB:-700}
    # BUTUH PERSETUJUAN USER: port host baru di luar 4310/4311/4320. Tanpa ini WebSocket layar tidak
    # bisa dijangkau Caddy; API internal tetap jalan lewat jaringan compose.
    # ports:
    #   - '127.0.0.1:4330:4000'
    read_only: true
    tmpfs:
      # Profil Chromium sementara per sesi + berkas unggahan sementara; dihapus saat sesi berakhir.
      - /tmp:size=512m
    # 2 sesi x ~700 MB batas per sesi + Node + proxy. Host bersama (agent-vm): jangan dinaikkan tanpa ukur.
    mem_limit: 1600m
    cpus: 2.0
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  data:
