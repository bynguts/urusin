# Produksi (VPS arm64/amd64). Jalankan lewat deploy/deploy.sh; jangan `up` manual tanpa .env.images.
# Caddy sistem (host) meneruskan host app dan verify (literal, dari deploy/hosts.json) ke 4310 (web-blue)
# dan 4311 (web-green) dengan `lb_policy first` (lihat Caddyfile.urusin.primary).
#
# JARINGAN: web memakai `network_mode: host` dan mengikat HANYA 127.0.0.1:<port> (HOST=127.0.0.1).
# Alasan: proxy LLM di host mendengarkan 0.0.0.0:20128, tetapi iptables INPUT men-DROP 20128 dari
# semua antarmuka kecuali lo/tailscale0; paket dari jaringan bridge Docker (src 172.x) ikut ter-DROP.
# Dengan jaringan host, web menjangkau proxy lewat loopback (LLM_BASE_URL=http://127.0.0.1:20128/v1)
# tanpa mengubah firewall. `ports:` tidak berlaku (dan tidak valid) pada network_mode host.
#
# Blue/green: deploy.sh memperbarui warna yang menganggur, menunggu sehat, lalu menghentikan warna
# lama. Keduanya memakai volume `data` yang sama (SQLite WAL, satu host): lihat bagian "Migrasi"
# di deploy/README.md; hanya warna baru yang boleh menjalankan migrasi (RUN_MIGRATIONS=1).
name: urusin

x-web: &web
  restart: unless-stopped
  network_mode: host
  env_file: .env
  read_only: true
  tmpfs:
    - /tmp:size=64m
  # Batas per kontainer. Saat deploy dua warna hidup bersamaan: total <= 1 GiB dari ~7,6 GiB bebas.
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-web-env: &web-env
  NODE_ENV: production
  # PORT dan HOST ditimpa per service (host network: ikat 127.0.0.1:<port> saja, jangan 0.0.0.0).
  HOST: 127.0.0.1
  # Semua host diturunkan dari DOMAIN agar tetap satu set deploy/hosts.json (startup menolak campuran).
  DOMAIN: ${DOMAIN:?DOMAIN wajib diisi}
  VERIFY_HOST: verify.${DOMAIN:?DOMAIN wajib diisi}
  FIXTURES_HOST: fixtures.${DOMAIN:?DOMAIN wajib diisi}
  ORIGIN: https://${DOMAIN:?DOMAIN wajib diisi}
  URUSIN_PUBLIC_ORIGIN: https://${DOMAIN:?DOMAIN wajib diisi}
  PROTOCOL_HEADER: x-forwarded-proto
  # Caddy = satu-satunya hop dan menimpa X-Forwarded-For dari klien (bukan proxy tepercaya), jadi entri
  # terakhir (XFF_DEPTH=1) adalah IP klien asli. Dipakai kuota per-IP.
  ADDRESS_HEADER: X-Forwarded-For
  XFF_DEPTH: '1'
  BODY_SIZE_LIMIT: 10M
  DATABASE_URL: file:/data/urusin.db

services:
  # Selalu berdasarkan digest, mis. ghcr.io/bynguts/urusin-web@sha256:... (ditulis deploy.sh ke
  # .env.images). Warna yang belum pernah dideploy memakai placeholder dan tidak dijalankan.
  web-blue:
    <<: *web
    image: ${WEB_IMAGE_BLUE:-ghcr.io/bynguts/urusin-web:unset}
    environment:
      <<: *web-env
      GIT_SHA: ${GIT_SHA_BLUE:-}
      PORT: '4310'
      URUSIN_COLOR: blue
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_BLUE:-0}
    volumes:
      # SQLite (mode WAL: berkas -wal/-shm ikut di volume ini).
      - data:/data

  web-green:
    <<: *web
    image: ${WEB_IMAGE_GREEN:-ghcr.io/bynguts/urusin-web:unset}
    environment:
      <<: *web-env
      GIT_SHA: ${GIT_SHA_GREEN:-}
      PORT: '4311'
      URUSIN_COLOR: green
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_GREEN:-0}
    volumes:
      - data:/data

  # Opsional: profil fixture publik (portal palsu untuk demo). Belum tentu ada imagenya.
  # Tetap di jaringan bridge dengan publish 127.0.0.1:4320: fixtures tidak butuh proxy LLM, jadi
  # tidak perlu jaringan host; bridge menjaga isolasi (konten uji tidak melihat port lain di host).
  # Aktifkan dengan `COMPOSE_PROFILES=fixtures` dan FIXTURES_IMAGE@digest.
  fixtures:
    profiles: [fixtures]
    image: ${FIXTURES_IMAGE:-ghcr.io/bynguts/urusin-fixtures:unset}
    restart: unless-stopped
    environment:
      FIXTURES_PROFILE: public
      FIXTURES_PUBLIC_ORIGIN: https://fixtures.${DOMAIN:?DOMAIN wajib diisi}
    ports:
      - '127.0.0.1:4320:4000'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Opsional: Browser Pendamping (Chromium headed per sesi warga di Xvfb; docs/adr/0029-browser-pendamping.md).
  # Aktifkan dengan `COMPOSE_PROFILES=pendamping`, PENDAMPING_IMAGE@digest, dan di .env:
  #   PENDAMPING_INTERNAL_TOKEN=<acak >= 32 karakter>    (dipakai web DAN pendamping)
  #   PENDAMPING_INTERNAL_URL=http://127.0.0.1:4330      (dibaca web lewat env_file)
  #   PENDAMPING_EDGE_TOKEN=<acak >= 32 karakter>        (pendamping -> edge; BEDA dari token internal)
  #   PENDAMPING_DEBUG_TOKEN=<acak >= 32 karakter>        (opsional: /debug kemudi manual lewat SSH -L)
  #   PENDAMPING_UPSTREAM_PROXY=http://host:port          (opsional: egress hulu milik operator, dipakai edge)
  #
  # ISOLASI (temuan keamanan B1; TANPA iptables, hanya topologi compose):
  # - `pendamping` (Node + Chromium) HANYA di jaringan `pendamping_internal`: `internal: true` (tanpa rute
  #   keluar), gateway IPv4 host `isolated` (host tidak punya alamat di bridge ini, jadi tidak terjangkau),
  #   IPv6 mati. Tidak ada port yang dipublikasikan. Boot gagal-tertutup bila ada rute default atau sandbox
  #   Chromium tidak aktif (apps/pendamping/src/isolasi.ts).
  # - `pendamping-edge` (image sama, `node dist/edge-main.js`) di internal + bridge `pendamping_luar`:
  #   (1) proxy balik 127.0.0.1:4330 -> pendamping, HANYA /ws/*, /internal/*, /health (dan /debug bila
  #   PENDAMPING_DEBUG_TOKEN diisi); (2) satu-satunya proxy CONNECT Chromium: kredensial acak per sesi,
  #   resolusi DNS sendiri, setiap alamat diperiksa `checkConnect` profil browser (loopback, RFC1918, CGNAT,
  #   link-local, gateway bridge, ::ffff:/NAT64 ditolak; hanya https:443 ke host union registry).
  # Butuh Docker Engine >= 28 (driver_opts gateway_mode_ipv4). Port host 4330: BUTUH PERSETUJUAN USER.
  # Caddy meneruskan HANYA /pendamping/ws/* (lihat Caddyfile.urusin; masih dikomentari sampai disetujui).
  pendamping:
    profiles: [pendamping]
    image: ${PENDAMPING_IMAGE:-ghcr.io/bynguts/urusin-pendamping:unset}
    restart: unless-stopped
    networks: [pendamping_internal]
    # tini: SIGTERM sampai ke Node (yang menutup sesi dan Xvfb) dan proses Chromium yatim dipungut.
    init: true
    environment:
      NODE_ENV: production
      # Ikat satu-satunya IPv4 kontainer (jaringan internal), bukan wildcard.
      HOST: antarmuka
      PORT: '4330'
      GIT_SHA: ${GIT_SHA_PENDAMPING:-}
      PENDAMPING_INTERNAL_TOKEN: ${PENDAMPING_INTERNAL_TOKEN:-} # wajib >= 32 karakter; pendamping menolak start tanpanya
      PENDAMPING_EDGE_URL: http://pendamping-edge:3129
      PENDAMPING_EDGE_TOKEN: ${PENDAMPING_EDGE_TOKEN:-} # wajib >= 32 karakter
      URUSIN_PUBLIC_ORIGIN: https://${DOMAIN:?DOMAIN wajib diisi}
      PENDAMPING_PUBLIC_WS_URL: wss://${DOMAIN:?DOMAIN wajib diisi}/pendamping/ws
      PENDAMPING_MAX_SESSIONS: ${PENDAMPING_MAX_SESSIONS:-2}
      PENDAMPING_MAX_QUEUE: ${PENDAMPING_MAX_QUEUE:-20}
      PENDAMPING_SESSION_MEM_MB: ${PENDAMPING_SESSION_MEM_MB:-450}
      PENDAMPING_FPS: ${PENDAMPING_FPS:-8}
      PENDAMPING_DEBUG_TOKEN: ${PENDAMPING_DEBUG_TOKEN:-}
    read_only: true
    tmpfs:
      # Profil Chromium sementara per sesi + soket/cookie Xvfb; dihapus saat sesi/layanan berakhir.
      - /tmp:size=768m
    # Anggaran: 2 sesi x 512 MB (pengawas menghentikan sesi di 450 MB) + Node dan Xvfb (~200 MB).
    # Host bersama (agent-vm): jangan dinaikkan tanpa ukur.
    mem_limit: 1300m
    memswap_limit: 1300m
    # CPU host bersama: maksimal 1 inti, dan prioritas rendah saat berebut dengan layanan lain.
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 512
    # Tanpa core dump: memori renderer bisa memuat ketikan/kredensial warga.
    ulimits:
      core: 0
    # Sandbox Chromium AKTIF (tanpa --no-sandbox), ADR 0029. agent-vm mematikan user namespace tak berhak
    # (unprivileged_userns_clone=0, sysctl host tidak kita ubah), jadi namespace renderer dibuat oleh helper
    # SETUID `chrome-sandbox` (root 4755, satu-satunya biner SUID di image). Set minimal, diukur (userns mati):
    # - SYS_ADMIN: helper (euid 0) clone(CLONE_NEWPID|CLONE_NEWNET) untuk renderer; kernel mewajibkan
    #   CAP_SYS_ADMIN untuk namespace non-user. Tanpanya: "No usable sandbox".
    # - SYS_CHROOT: helper chroot() ke direktori kosong sebelum membuang hak. Tanpanya: gagal.
    # - TANPA no-new-privileges (HANYA layanan ini; edge tetap memakainya): dengan no-new-privileges exec
    #   helper SUID tidak menaikkan euid, sandbox gagal. SETUID/SETGID tidak perlu (diukur).
    # Proses pwuser sendiri tetap tanpa capability efektif/permitted (cap di atas hanya di bounding set dan
    # hanya dipakai helper SUID yang langsung membuangnya); tidak ada biner SUID lain yang bisa memakainya.
    # Profil seccomp Playwright tidak diubah.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_CHROOT]
    security_opt:
      - seccomp=./pendamping-seccomp.json
    healthcheck:
      test: ['CMD', 'node', 'dist/sehat.js', '4330']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  pendamping-edge:
    profiles: [pendamping]
    image: ${PENDAMPING_IMAGE:-ghcr.io/bynguts/urusin-pendamping:unset}
    restart: unless-stopped
    command: ['node', 'dist/edge-main.js']
    networks: [pendamping_internal, pendamping_luar]
    ports:
      - '127.0.0.1:4330:4330'
    depends_on: [pendamping]
    init: true
    environment:
      NODE_ENV: production
      EDGE_PENDAMPING_URL: http://pendamping:4330
      PENDAMPING_EDGE_TOKEN: ${PENDAMPING_EDGE_TOKEN:-}
      # Hanya penanda: /debug diteruskan bila token ini diisi (diperiksa pendamping, bukan edge).
      PENDAMPING_DEBUG_TOKEN: ${PENDAMPING_DEBUG_TOKEN:-}
      PENDAMPING_UPSTREAM_PROXY: ${PENDAMPING_UPSTREAM_PROXY:-}
    user: pwuser
    read_only: true
    tmpfs:
      - /tmp:size=8m
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    cpu_shares: 256
    pids_limit: 64
    ulimits:
      core: 0
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', 'dist/sehat.js', '3129']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  # Jaringan Chromium: tanpa rute keluar, host tidak punya alamat di bridge ini, IPv6 mati.
  pendamping_internal:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Sisi luar edge (port 127.0.0.1:4330 dan egress yang sudah diperiksa).
  pendamping_luar:
    driver: bridge
    enable_ipv6: false

volumes:
  data:
