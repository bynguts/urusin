# buildkitd untuk builder buildx `urusin-ci` (docker-container driver) di agent-vm.
# Cache build dibatasi; dibersihkan HANYA lewat `ci-docker builder-gc` (buildx prune --builder urusin-ci) atau
# `ci-docker builder-rm`. Tidak pernah prune global, tidak pernah daemon.json.
# maxUsedSpace = batas atas (keepBytes/gckeepstorage lama kini berarti reservedSpace, yaitu batas BAWAH).
[worker.oci]
  gc = true
  maxUsedSpace = "1500MB" # ~1,5 GB (anggaran disk agent-vm); sama dengan CACHE_MAX di ci-docker

  # Aturan kustom menggantikan bawaan buildkit: dulu yang tak dipakai 7 hari, lalu apa pun sampai <= 1,5 GB.
  [[worker.oci.gcpolicy]]
    keepDuration = 604800 # 7 hari
    all = true
    maxUsedSpace = "1500MB"

  [[worker.oci.gcpolicy]]
    all = true
    maxUsedSpace = "1500MB"

# Tidak ada entitlement tambahan: tanpa `security.insecure`, tanpa `network.host`.
